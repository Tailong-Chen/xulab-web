name: Deploy to Tencent COS CDN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xulab-tencent-cos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
      TENCENT_COS_PREFIX: ${{ vars.TENCENT_COS_PREFIX }}
      TENCENT_CDN_DOMAIN: ${{ vars.TENCENT_CDN_DOMAIN }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tencent Cloud SDKs
        if: >-
          env.TENCENTCLOUD_SECRET_ID != '' &&
          env.TENCENTCLOUD_SECRET_KEY != '' &&
          env.TENCENT_COS_BUCKET != '' &&
          env.TENCENT_COS_REGION != ''
        run: python -m pip install --disable-pip-version-check cos-python-sdk-v5 tencentcloud-sdk-python

      - name: Validate static export
        run: python scripts/check_site.py

      - name: Synchronize COS and refresh Tencent CDN
        if: >-
          env.TENCENTCLOUD_SECRET_ID != '' &&
          env.TENCENTCLOUD_SECRET_KEY != '' &&
          env.TENCENT_COS_BUCKET != '' &&
          env.TENCENT_COS_REGION != ''
        run: python scripts/deploy_cos.py --delete

      - name: Tencent deployment is not configured
        if: >-
          env.TENCENTCLOUD_SECRET_ID == '' ||
          env.TENCENTCLOUD_SECRET_KEY == '' ||
          env.TENCENT_COS_BUCKET == '' ||
          env.TENCENT_COS_REGION == ''
        run: |
          echo "Static checks passed. Add the Tencent Cloud production secrets and variables, then rerun this workflow."
